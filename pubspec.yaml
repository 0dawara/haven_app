name: haven_app
description: "A Flutter project experimentation with wallhaven API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  bloc: ^9.2.1
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  device_info_plus: ^12.4.0
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  http: ^1.6.0
  hydrated_bloc: ^11.0.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  share_plus: ^12.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  msix: ^3.16.13
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true

msix_config:
  display_name: Haven App
  publisher_display_name: odawara.dev
  store: false
  identity_name: br.com.odawara.havenapp
  msix_version: 1.0.0.1
  architecture: x64
  capabilities: internetClient, picturesLibrary
