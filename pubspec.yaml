name: haven
description: "A Flutter project experimentation with wallhaven API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  bloc: ^9.2.1
  cached_network_image: ^4.0.0
  collection: ^1.19.1
  cupertino_icons: ^1.0.9
  device_info_plus: ^13.2.0
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  hydrated_bloc: ^11.0.0
  intl: ^0.20.3
  logging: ^1.3.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  msix: ^3.18.0

flutter:
  uses-material-design: true
  generate: true

msix_config:
  display_name: Haven App
  publisher_display_name: odawara.dev
  store: false
  identity_name: br.com.odawara.haven
  msix_version: 1.0.0.1
  architecture: x64
  capabilities: internetClient, picturesLibrary
